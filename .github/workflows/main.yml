name: Cartadex cron de respaldo

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de sincronización
        run: |
          curl -fsS "https://cartadex.margarciab01.workers.dev/admin/run-cron?key=${{ secrets.ADMIN_KEY }}"
